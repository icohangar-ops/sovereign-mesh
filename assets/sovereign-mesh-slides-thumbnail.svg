<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">SovereignMesh slide deck thumbnail</title>
  <desc id="desc">Dark teal presentation thumbnail for SovereignMesh Agent Control Plane</desc>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00a09a" />
      <stop offset="100%" stop-color="#59e395" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#00a09a" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0c2e34" stop-opacity="0" />
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#00a09a" fill-opacity="0.10" />
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#0c2e34" />
  <rect width="1600" height="900" fill="url(#glow)" />
  <rect width="1600" height="900" fill="url(#dots)" opacity="0.6" />

  <rect x="112" y="112" width="1376" height="676" rx="30" fill="#102e36" fill-opacity="0.90" stroke="#1c464c" stroke-width="2" />
  <rect x="112" y="112" width="1376" height="8" rx="4" fill="url(#bar)" />

  <image href="thumbnail.jpg" x="160" y="172" width="700" height="394" preserveAspectRatio="xMidYMid slice" rx="22" />
  <rect x="160" y="172" width="700" height="394" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" />

  <image href="architecture_diagram.png" x="900" y="172" width="460" height="394" preserveAspectRatio="xMidYMid slice" rx="22" />
  <rect x="900" y="172" width="460" height="394" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" />

  <text x="160" y="652" fill="#00a09a" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="4">AI INFRA SUMMIT HACKATHON</text>
  <text x="160" y="726" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="74" font-weight="900" letter-spacing="-3">SovereignMesh</text>
  <text x="160" y="784" fill="#cde4e1" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="400">Agent Control Plane for zero-trust multi-agent AI workflows</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="1000" y="674" width="122" height="72" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="1032" y="718" fill="#ffffff" font-size="28" font-weight="900">ReBAC</text>

    <rect x="1132" y="674" width="122" height="72" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="1167" y="718" fill="#ffffff" font-size="28" font-weight="900">CHP</text>

    <rect x="1264" y="674" width="122" height="72" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="1281" y="718" fill="#ffffff" font-size="24" font-weight="900">Ledger</text>
  </g>
</svg>
